<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Гараж: собери тачку</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1915; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #1d1915; touch-action: none; }
    #loader { position: fixed; inset: 0; display: grid; place-items: center; color: #f4ede2; font: 700 20px system-ui, sans-serif; text-align: center; }
    #loader h1 { color: #ffb627; margin: 0 0 14px; font-size: 44px; }
    #bar { width: 260px; height: 12px; border-radius: 6px; background: #3a332b; overflow: hidden; margin: 0 auto; }
    #fill { height: 100%; width: 0; background: #ffb627; transition: width .2s; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader"><div><h1>ГАРАЖ</h1><div id="bar"><div id="fill"></div></div><p id="msg">Открываем ворота…</p></div></div>
  <script>
    // SDK Яндекса отдаётся по /sdk.js только на их хостинге; локально — работаем без него
    function loadSdk() {
      return new Promise(function (resolve) {
        var s = document.createElement("script");
        var done = function (ok) { resolve(ok); };
        s.src = "/sdk.js"; s.onload = function () { done(true); }; s.onerror = function () { done(false); };
        document.head.appendChild(s);
        setTimeout(function () { done(false); }, 4000);
      });
    }
    (async function () {
      if (await loadSdk() && window.YaGames) {
        try {
          window.ysdk = await YaGames.init();
          try { window.yaPlayer = await window.ysdk.getPlayer({ scopes: false }); } catch (e) { console.warn("no player", e); }
        } catch (e) { console.warn("YaGames.init failed", e); }
      }
      var canvas = document.getElementById("unity-canvas");
      var script = document.createElement("script");
      script.src = "Build/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, {
          dataUrl: "Build/WebGL.data.unityweb",
          frameworkUrl: "Build/WebGL.framework.js.unityweb",
          codeUrl: "Build/WebGL.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "dft",
          productName: "Гараж: собери тачку",
          productVersion: "1.0",
          matchWebGLToCanvasSize: true,
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        }, function (p) {
          document.getElementById("fill").style.width = Math.round(p * 100) + "%";
        }).then(function (instance) {
          window.unityInstance = instance;
          // Загрузчик убирает сама игра (GaHideLoader), когда прогреет шейдеры; запасной таймер — если что-то пошло не так
          document.getElementById("msg").textContent = "Прогреваем мотор…";
          setTimeout(function () { var l = document.getElementById("loader"); if (l) l.remove(); }, 20000);
        }).catch(function (e) {
          document.getElementById("msg").textContent = "Не удалось запустить игру: " + e;
        });
      };
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
